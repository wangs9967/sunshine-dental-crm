[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="sunshine-dental-backend"
version="0.1.0"
requires-python=">=3.12"
dependencies=["fastapi>=0.110,<1","uvicorn[standard]>=0.27,<1","pydantic>=2.6,<3","SQLAlchemy>=2,<3","alembic>=1.13,<2","psycopg[binary]>=3.1,<4","redis>=5,<6","celery>=5.3,<6"]
[project.optional-dependencies]
dev=["pytest>=8,<9","httpx>=0.27,<1"]
